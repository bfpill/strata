<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Concept: Whitney umbrella / stratified space - layers that pinch to a singular line -->
  <rect width="200" height="200" fill="#fafafa"/>

  <!-- Strata that pinch together vertically along a singular locus -->
  <!-- Wide at top and bottom, converging to a line in the middle -->

  <!-- Outer strata pairs -->
  <path d="M10 20 C30 25, 60 40, 80 70 C90 90, 95 100, 100 100 C105 100, 110 90, 120 70 C140 40, 170 25, 190 20" stroke="#bfdbfe" stroke-width="2.5" fill="none"/>
  <path d="M10 180 C30 175, 60 160, 80 130 C90 110, 95 100, 100 100 C105 100, 110 110, 120 130 C140 160, 170 175, 190 180" stroke="#bfdbfe" stroke-width="2.5" fill="none"/>

  <!-- Inner strata pairs -->
  <path d="M25 30 C45 38, 65 55, 82 78 C92 93, 97 100, 100 100 C103 100, 108 93, 118 78 C135 55, 155 38, 175 30" stroke="#60a5fa" stroke-width="2.5" fill="none"/>
  <path d="M25 170 C45 162, 65 145, 82 122 C92 107, 97 100, 100 100 C103 100, 108 107, 118 122 C135 145, 155 162, 175 170" stroke="#60a5fa" stroke-width="2.5" fill="none"/>

  <!-- Tightest strata -->
  <path d="M45 45 C60 55, 75 70, 88 88 C95 96, 98 100, 100 100 C102 100, 105 96, 112 88 C125 70, 140 55, 155 45" stroke="#2563eb" stroke-width="3" fill="none"/>
  <path d="M45 155 C60 145, 75 130, 88 112 C95 104, 98 100, 100 100 C102 100, 105 104, 112 112 C125 130, 140 145, 155 155" stroke="#2563eb" stroke-width="3" fill="none"/>

  <!-- Singular point where all strata meet -->
  <circle cx="100" cy="100" r="4" fill="#1e40af"/>
</svg>
