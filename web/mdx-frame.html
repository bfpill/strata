<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Strata MDX</title>
    <style>
      html, body { margin: 0; padding: 0; }
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; color: #1f2937; line-height: 1.6; padding: 1rem 1.25rem; }
      #root > .mdx-content > :first-child { margin-top: 0; }
      h1, h2, h3, h4, h5, h6 { font-weight: 600; line-height: 1.25; margin: 1.4em 0 0.5em; }
      h1 { font-size: 1.6rem; } h2 { font-size: 1.35rem; } h3 { font-size: 1.15rem; } h4 { font-size: 1.0rem; }
      p, ul, ol { margin: 0.5em 0; }
      code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9em; background: #f3f4f6; padding: 0.1em 0.3em; border-radius: 3px; }
      pre { background: #f3f4f6; padding: 0.75rem; border-radius: 4px; overflow-x: auto; }
      pre code { background: transparent; padding: 0; }
      blockquote { border-left: 3px solid #d1d5db; padding-left: 0.75rem; color: #4b5563; margin: 0.5em 0; }
      table { border-collapse: collapse; margin: 0.75em 0; }
      th, td { border: 1px solid #e5e7eb; padding: 0.35em 0.6em; text-align: left; }
      th { background: #f9fafb; font-weight: 600; }
      a { color: #2563eb; text-decoration: none; } a:hover { text-decoration: underline; }
      .mdx-error { color: #b91c1c; background: #fef2f2; border: 1px solid #fecaca; padding: 0.75rem; border-radius: 4px; font-family: ui-monospace, monospace; white-space: pre-wrap; font-size: 0.85rem; }
      .mdx-loading { color: #6b7280; padding: 1rem 0; }
    </style>
  </head>
  <body>
    <div id="root"><div class="mdx-loading">Loading MDX…</div></div>
    <script type="module" src="/src/mdx-frame/main.tsx"></script>
  </body>
</html>
